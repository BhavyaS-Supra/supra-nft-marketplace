[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.30"
optimizer = true
optimizer_runs = 200
# Raised so tests can exercise the full 10,000-mint MAX_SUPPLY boundary in one run; this only
# affects the local test/anvil backend, not deployed contract behavior.
gas_limit = "18446744073709551615"

[fmt]
quote_style = "double"
line_length = 120

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
supra_evm_devnet = "${SUPRA_EVM_RPC_URL}"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
